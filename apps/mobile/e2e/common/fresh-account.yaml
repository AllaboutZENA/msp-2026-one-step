# Subflow: open the app signed out and sign up a fresh synthetic account
# (e2e-<timestamp>@example.com). Ends on the empty home screen.
appId: host.exp.Exponent
---
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible: "로그인|설정"
    timeout: 60000
- runFlow:
    when:
      visible: "설정"
    commands:
      - tapOn: "설정"
      - tapOn: "로그아웃"
      - extendedWaitUntil:
          visible: "회원가입"
          timeout: 15000
- tapOn: "회원가입"
- tapOn:
    id: "email-input"
- inputText: ${'e2e-' + Date.now() + '@example.com'}
- tapOn:
    id: "password-input"
- inputText: "e2e-password-1"
# Dismiss the keyboard first: with a notice banner shown it can cover the button.
- tapOn: "비밀번호"
- tapOn: "가입하고 시작하기"
- tapOn:
    text: "지금 안 함|Not Now"
    optional: true
- extendedWaitUntil:
    visible: "남은 과제가 없어요"
    timeout: 15000
